# Artifact origin vhost. Replace artifacts.example.com with the real artifact
# hostname (must match ARTIFACT_URL in /etc/artifactflow/app.env and must be a
# DIFFERENT hostname from the app, cookies ignore ports, and the artifact
# origin must never receive app session cookies). Install and certbot the same
# way as the app vhost.
#
# HARD RULE for this vhost: nothing here may ever emit Set-Cookie or attach
# cookie-bearing behavior (sticky sessions, auth modules, add_header
# Set-Cookie, third-party modules that tag clients). The artifact container
# strips every cookie it produces, but it cannot strip headers appended by
# this edge after the response leaves the container. Keep this vhost a bare
# TLS pass-through.

server {
    listen 80;
    listen [::]:80;
    server_name artifacts.example.com;

    # The in-container Caddy enforces the authoritative per-route body caps.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
