# App origin vhost. Replace flow.example.com with the real app hostname
# (must match APP_URL in /etc/artifactflow/app.env), install to
# /etc/nginx/sites-available/, symlink into sites-enabled/, then run
# `certbot --nginx -d flow.example.com` to add TLS + the HTTPS redirect.
#
# nginx terminates TLS only; the container's own Caddy/FrankenPHP is the web
# server and sets the security headers (CSP, HSTS, etc.), do not add or
# override security headers here.
#
# TRUSTED_PROXIES=REMOTE_ADDR in app.env trusts the immediate peer, i.e. this
# nginx. That is safe only while 127.0.0.1:8080 stays loopback-bound and
# unreachable except through nginx, never publish the container port on a
# routable address.

server {
    listen 80;
    listen [::]:80;
    server_name flow.example.com;

    # The in-container Caddy enforces the authoritative body caps (25 MB
    # general, 6 MB on the draft-preview route). This just stays out of the
    # way with multipart headroom.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
